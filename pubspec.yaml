name: responsive_flex_list
description: Responsive Flutter list, grid, and masonry layouts with animations, separators, custom breakpoints, and RTL-aware behavior for mobile, desktop, and web.
version: 1.4.0
homepage: https://github.com/awais305/responsive_flex_list
repository: https://github.com/awais305/responsive_flex_list
issue_tracker: https://github.com/awais305/responsive_flex_list/issues

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - responsive
  - grid
  - masonry
  - layout
  - flutter-web

screenshots:
  - description: Responsive list to grid demo.
    path: assets/demo.gif

  - description: Pinterest-style masonry layout.
    path: assets/pinterest.png

  - description: Instagram-style masonry layout.
    path: assets/instagram.png